<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>AI Inter-Layer Portal</title>
    <style>
        body { margin: 0; overflow: hidden; background: rgba(10, 10, 12, 0.9); color: #00f2ff; font-family: 'Segoe UI', sans-serif; }
        #canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
        .item {
            position: absolute;
            width: 100px; height: 100px;
            background: linear-gradient(135deg, #ff0055, #ff9900);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: white;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.6);
            user-select: none; z-index: 9999;
            cursor: grab;
        }
        #ui { position: absolute; top: 10px; left: 10px; pointer-events: none; font-size: 12px; }
    </style>
</head>
<body>

    <div id="ui">AI-SYNCHRONISATION AKTIV</div>
    <canvas id="canvas"></canvas>

    <script>
        const kanal = new BroadcastChannel('super_portal');
        let meinX, meinY;
        let itemPos = { x: 200, y: 200, text: "AI-CORE" }; // Globale Monitor-Position
        let isDragging = false;
        let lastUpdate = 0;

        // Erstelle das visuelle Element
        const div = document.createElement('div');
        div.className = 'item';
        div.innerText = itemPos.text;
        document.body.appendChild(div);

        // Drag & Drop Logik
        div.onmousedown = () => { isDragging = true; div.style.cursor = 'grabbing'; };
        window.onmouseup = () => { isDragging = false; div.style.cursor = 'grab'; };

        window.onmousemove = (e) => {
            if (!isDragging) return;
            // Berechne neue Monitor-Position basierend auf Maus
            itemPos.x = (window.screenLeft || window.screenX) + e.clientX - 50;
            itemPos.y = (window.screenTop || window.screenY) + e.clientY - 50;
            
            // Sende neue Position an alle
            kanal.postMessage({ type: 'move', x: itemPos.x, y: itemPos.y });
            updateLocalPos();
        };

        kanal.onmessage = (event) => {
            if (event.data.type === 'move') {
                itemPos.x = event.data.x;
                itemPos.y = event.data.y;
                updateLocalPos();
            }
        };

        function updateLocalPos() {
            const localX = itemPos.x - (window.screenLeft || window.screenX);
            const localY = itemPos.y - (window.screenTop || window.screenY);

            // Sichtbarkeit prüfen: Ist das Item im aktuellen Fensterbereich?
            if (localX > -100 && localX < window.innerWidth && localY > -100 && localY < window.innerHeight) {
                div.style.display = 'flex';
                div.style.left = localX + 'px';
                div.style.top = localY + 'px';
            } else {
                div.style.display = 'none'; // Verstecken, wenn es "woanders" ist
            }
        }

        // Loop zur ständigen Synchronisation (falls Fenster verschoben werden)
        function loop() {
            updateLocalPos();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
