<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktive Fenster</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; transition: background 0.3s; }
        .card { border: 2px solid #333; padding: 20px; display: inline-block; border-radius: 10px; background: white; }
        button { padding: 10px 20px; cursor: pointer; font-size: 16px; margin: 5px; }
        #status { font-weight: bold; color: #007bff; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Fenster-Steuerung</h1>
        <p>Klicke einen Button, um alle offenen Tabs zu verändern!</p>
        
        <button onclick="sendeBefehl('red', 'Gefahr! 🔴')">Rot</button>
        <button onclick="sendeBefehl('lightgreen', 'Alles okay 🟢')">Grün</button>
        <button onclick="sendeBefehl('lightblue', 'Entspannung 🔵')">Blau</button>
        
        <div id="status">Warte auf Nachricht...</div>
    </div>

    <script>
        // 1. Wir erstellen einen Funkkanal namens "interaktion_kanal"
        const kanal = new BroadcastChannel('interaktion_kanal');

        // 2. Funktion zum Senden einer Nachricht
        function sendeBefehl(farbe, text) {
            const daten = { farbe: farbe, botschaft: text };
            
            // Nachricht an ANDERE Tabs senden
            kanal.postMessage(daten);
            
            // Auch das EIGENE Fenster aktualisieren (Interaktion mit sich selbst)
            aktualisiereSeite(daten);
        }

        // 3. Funktion zum Empfangen von Nachrichten von ANDEREN Tabs
        kanal.onmessage = (event) => {
            aktualisiereSeite(event.data);
        };

        // 4. Die eigentliche Änderung auf der Seite
        function aktualisiereSeite(daten) {
            document.body.style.backgroundColor = daten.farbe;
            document.getElementById('status').innerText = "Letzter Befehl: " + daten.botschaft;
        }
    </script>
</body>
</html>
