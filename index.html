<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Fenster-Tracker</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #111; color: white; }
        #info { position: absolute; top: 10px; left: 10px; pointer-events: none; }
        .punkt { 
            position: absolute; 
            width: 20px; height: 20px; 
            background: #00ffcc; border-radius: 50%; 
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px #00ffcc;
        }
    </style>
</head>
<body>

    <div id="info">Verschiebe dieses Fenster!</div>
    <div id="punkte-container"></div>

    <script>
        const kanal = new BroadcastChannel('fenster_sync');
        const container = document.getElementById('punkte-container');
        const meineId = Math.random().toString(36).substr(2, 9);
        const andereFenster = {};

        function sendePosition() {
            const daten = {
                id: meineId,
                // x und y auf dem echten Monitor + Fenstergröße
                screenX: window.screenX,
                screenY: window.screenY,
                width: window.innerWidth,
                height: window.innerHeight,
                centerX: window.screenX + window.innerWidth / 2,
                centerY: window.screenY + window.innerHeight / 2
            };
            kanal.postMessage(daten);
        }

        kanal.onmessage = (event) => {
            const d = event.data;
            if (d.id === meineId) return;

            // Wir berechnen, wo das ANDERE Fenster relativ zu UNSEREM Fenster ist
            const relX = d.centerX - window.screenX;
            const relY = d.centerY - window.screenY;

            // Punkt erstellen oder aktualisieren
            if (!andereFenster[d.id]) {
                const div = document.createElement('div');
                div.className = 'punkt';
                container.appendChild(div);
                andereFenster[d.id] = div;
            }

            const punkt = andereFenster[d.id];
            punkt.style.left = relX + 'px';
            punkt.style.top = relY + 'px';
        };

        // Sende Position, wenn das Fenster bewegt oder verändert wird
        setInterval(sendePosition, 50); 

        // Animation Loop für flüssige Darstellung
        function loop() {
            sendePosition();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
