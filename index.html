<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Fenster-Connect</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #050505; 
            color: #00ffcc; 
            font-family: 'Courier New', monospace; 
        }
        #info { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            z-index: 10;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border: 1px solid #00ffcc;
        }
        canvas { position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>

    <div id="info">
        <b>Status:</b> Suche andere Fenster...<br>
        <small>Öffne diesen Link in einem zweiten Tab/Fenster!</small>
    </div>
    
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const kanal = new BroadcastChannel('fenster_sync_v2');
        const meineId = Math.random().toString(36).substring(2, 9);
        
        let andereFenster = {};

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function sendePosition() {
            const daten = {
                id: meineId,
                // Wir nutzen screenLeft/Top (moderner) oder screenX/Y
                x: window.screenLeft || window.screenX,
                y: window.screenTop || window.screenY,
                w: window.innerWidth,
                h: window.innerHeight,
                zeit: Date.now()
            };
            kanal.postMessage(daten);
        }

        kanal.onmessage = (event) => {
            // Speichere Daten der anderen Fenster
            andereFenster[event.data.id] = event.data;
        };

        function zeichne() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const meinX = window.screenLeft || window.screenX;
            const meinY = window.screenTop || window.screenY;

            // Zeichne Verbindung zu jedem anderen Fenster
            for (let id in andereFenster) {
                const f = andereFenster[id];
                
                // Wenn das Fenster länger als 1 Sekunde nicht geantwortet hat, löschen
                if (Date.now() - f.zeit > 1000) {
                    delete andereFenster[id];
                    continue;
                }

                // Berechne die Mitte des ANDEREN Fensters relativ zu MEINER Ecke links oben
                const zielX = (f.x + f.w / 2) - meinX;
                const zielY = (f.y + f.h / 2) - meinY;

                // Zeichne Linie zur Mitte
                ctx.beginPath();
                ctx.moveTo(window.innerWidth / 2, window.innerHeight / 2);
                ctx.lineTo(zielX, zielY);
                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Zeichne Kreis am Ende der Linie
                ctx.beginPath();
                ctx.arc(zielX, zielY, 15, 0, Math.PI * 2);
                ctx.fillStyle = '#ff0055';
                ctx.fill();
            }

            requestAnimationFrame(zeichne);
        }

        // Starte Sende-Intervall (20 mal pro Sekunde)
        setInterval(sendePosition, 50);
        
        // Starte Animations-Loop
        zeichne();
    </script>
</body>
</html>
